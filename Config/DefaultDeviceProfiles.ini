[IOS DeviceProfile]
+CVars=r.MobileContentScaleFactor=0
; HDR forward lighting with FXAA avoids the broken iOS LDR MSAA resolve.
+CVars=r.MSAACount=1
+CVars=r.Mobile.AntiAliasing=1
; Mobile forward translucency leaves the feedback pixel shader's UAV unbound.
; Use the standard occlusion path until the engine feedback pass is repaired.
+CVars=r.OcclusionFeedback.Enable=0
+CVars=r.ViewDistanceScale=1
+CVars=r.ShadowQuality=3
+CVars=r.Shadow.MaxResolution=1024
+CVars=r.Shadow.MaxCSMResolution=1024
+CVars=r.Shadow.CSM.MaxCascades=2
+CVars=r.DefaultFeature.Bloom=1
+CVars=r.BloomQuality=3
+CVars=r.Tonemapper.Quality=2
+CVars=r.MaxAnisotropy=8
+CVars=r.PostProcessAAQuality=2
+CVars=t.MaxFPS=60

; MacEditor and MacClient inherit this desktop profile. Keep the iOS budget above separate.
[Mac DeviceProfile]
